<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef8fb">
  <title>Silvia's Baby Shower</title>
  <style>
    :root {
      --ink: #214f63;
      --sky: #eef8fb;
      --cream: #fffdf8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--sky);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      border: 0;
      background: none;
    }

    .experience {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(126, 191, 216, .18), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(126, 191, 216, .15), transparent 28%),
        linear-gradient(135deg, #f8fcfd, #eaf6fa);
    }

    .front {
      width: min(100%, 560px);
      min-height: min(88vh, 820px);
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      isolation: isolate;
      transition: opacity .45s ease;
    }

    .front::before,
    .front::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
      filter: blur(1px);
      z-index: -1;
    }
    .front::before { width: 280px; height: 280px; top: 7%; left: -8%; }
    .front::after { width: 240px; height: 240px; bottom: 8%; right: -5%; }

    .invite-label {
      position: absolute;
      top: 12%;
      left: 0;
      right: 0;
      font-size: clamp(15px, 3vw, 20px);
      letter-spacing: .34em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hint {
      position: absolute;
      bottom: 9%;
      left: 0;
      right: 0;
      font-size: 15px;
      letter-spacing: .12em;
      opacity: .72;
    }

    .star-button {
      width: min(76vw, 390px);
      aspect-ratio: 1 / .92;
      cursor: pointer;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      transition:
        transform 1.15s cubic-bezier(.2,.8,.2,1),
        opacity .9s ease,
        filter .8s ease;
      z-index: 5;
      touch-action: manipulation;
    }

    .star-button:focus-visible {
      outline: 4px solid rgba(33,79,99,.35);
      outline-offset: 12px;
      border-radius: 50%;
    }

    .star-art {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 18px 18px rgba(50, 75, 82, .18));
    }

    .star-art {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .front-copy {
      position: absolute;
      bottom: 17%;
      left: 0;
      right: 0;
      pointer-events: none;
    }

    .front-copy h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 72px);
      line-height: .95;
      font-weight: 400;
      font-style: italic;
      letter-spacing: -.04em;
    }

    .front-copy p {
      margin: 14px 0 0;
      font-size: 13px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .invitation {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .8s ease;
    }

    .invitation img {
      width: min(100vw, calc(100vh * 2 / 3));
      height: auto;
      max-height: 100vh;
      display: block;
      box-shadow: 0 16px 50px rgba(26, 60, 74, .15);
    }

    .balloon-overlay {
      position: absolute;
      width: min(38vw, calc(100vh * .25));
      aspect-ratio: 1 / .98;
      left: max(0px, calc((100vw - min(100vw, calc(100vh * 2 / 3))) / 2));
      top: max(0px, calc((100vh - min(100vw, calc(100vh * 2 / 3)) * 1.5) / 2));
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    .balloon-overlay svg { width: 100%; height: 100%; }

    .shown .front { opacity: 0; pointer-events: none; }
    .shown .invitation { opacity: 1; visibility: visible; }
    .shown .star-button {
      transform: translate(
        calc(-50% + (var(--move-x, 0px))),
        calc(-52% + (var(--move-y, 0px)))
      ) scale(var(--land-scale, .5));
      opacity: 0;
      pointer-events: none;
      transition:
        transform 1.25s cubic-bezier(.18,.82,.2,1),
        opacity .55s ease 1.02s;
    }

    .replay {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      display: none;
      padding: 11px 15px;
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      color: var(--ink);
      box-shadow: 0 6px 20px rgba(33,79,99,.16);
      cursor: pointer;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .shown .replay { display: block; }

    @media (prefers-reduced-motion: reduce) {
      .star-button, .front, .invitation { transition-duration: .01ms; }
      .shown .balloon-overlay { animation: none; opacity: 0; }
    }

    @media (max-width: 520px) {
      .experience { padding: 0; }
      .front { min-height: 100vh; }
      .hint { bottom: 7%; }
      .invite-label { top: 9%; }
    }
  </style>
</head>
<body>
  <main class="experience" id="experience">
    <section class="front" aria-label="Invitation cover">
      <div class="invite-label">You’re invited</div>

      <button class="star-button" id="starButton" aria-label="Open Silvia's baby shower invitation">
        <img class="star-art" src="star-balloon.png" alt="">
      </button>

      <div class="front-copy">
        <h1>Baby Shower</h1>
        <p>Tap the star to open</p>
      </div>

      <div class="hint">A special invitation for Silvia</div>
    </section>

    <section class="invitation" aria-label="Baby shower invitation">
      <img src="invitation.png" alt="Baby shower invitation for Silvia, October 18, 2026 at 1 PM">
    </section>

    <button class="replay" id="replay" type="button">Replay</button>
  </main>

  <script>
    (() => {
      const root = document.getElementById('experience');
      const star = document.getElementById('starButton');
      const replay = document.getElementById('replay');

      function openInvitation() {
        // The supplied invitation is 1024x1536. The large gold star occupies
        // roughly the upper-left 38% of the invitation width.
        const image = document.querySelector('.invitation img');
        const rect = image.getBoundingClientRect();
        const starRect = star.getBoundingClientRect();

        // Target the center of the star printed on the invitation.
        const targetX = rect.left + rect.width * 0.19;
        const targetY = rect.top + rect.height * 0.145;
        const startX = starRect.left + starRect.width / 2;
        const startY = starRect.top + starRect.height / 2;

        // Match the printed star's approximate width before fading out.
        const targetWidth = rect.width * 0.37;
        const landScale = Math.max(0.25, Math.min(0.9, targetWidth / starRect.width));

        root.style.setProperty('--move-x', `${targetX - startX}px`);
        root.style.setProperty('--move-y', `${targetY - startY}px`);
        root.style.setProperty('--land-scale', `${landScale}`);

        root.classList.add('shown');
        setTimeout(() => replay.focus({preventScroll: true}), 1450);
      }

      function resetInvitation() {
        root.classList.remove('shown');
        root.style.removeProperty('--move-x');
        root.style.removeProperty('--move-y');
        root.style.removeProperty('--land-scale');
        star.focus({preventScroll: true});
      }

      star.addEventListener('click', openInvitation);
      replay.addEventListener('click', resetInvitation);
    })();
  </script>
</body>
</html>
